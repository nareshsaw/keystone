# 1 control plane + 3 workers: lets the 3 Postgres instances land on 3 different nodes.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: keystone
nodes:
  - role: control-plane
  - role: worker
    labels: { topology.kubernetes.io/zone: zone-a }
  - role: worker
    labels: { topology.kubernetes.io/zone: zone-b }
  - role: worker
    labels: { topology.kubernetes.io/zone: zone-c }
