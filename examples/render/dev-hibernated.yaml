apiVersion: platform.keystone.io/v1alpha1
kind: PostgresDatabase
metadata: { name: inventory-db, namespace: inventory }
spec:
  environment: dev
  tier: small
  databaseName: inventory
  owner: team-inventory
  costCenter: CC-2002
  hibernate: true
  backup: { enabled: true, retentionDays: 7, schedule: "0 0 */6 * * *" }
  pooler: { enabled: true }
