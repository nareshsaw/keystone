# Minimal Argo CD for the platform. Installed once by scripts/bootstrap.sh; everything else is GitOps.
dex:
  enabled: false
notifications:
  enabled: false
configs:
  params:
    server.insecure: true
    # Server-side diff: fields owned by controllers (Crossplane, CNPG, defaults) are not reported as drift.
    controller.diff.server.side: "true"
  cm:
    # App-of-apps: make parent apps wait for child apps to be Healthy so sync waves are honoured.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs
    # A CloudNativePG cluster is only Healthy once all instances are up and replicating.
    resource.customizations.health.postgresql.cnpg.io_Cluster: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "Waiting for cluster"
      if obj.status ~= nil and obj.status.phase ~= nil then
        hs.message = obj.status.phase
        if obj.status.phase == "Cluster in healthy state" then
          hs.status = "Healthy"
        end
      end
      return hs
    resource.customizations.health.pkg.crossplane.io_Function: |
      hs = { status = "Progressing", message = "Installing function" }
      if obj.status ~= nil and obj.status.conditions ~= nil then
        local healthy, installed = false, false
        for _, c in ipairs(obj.status.conditions) do
          if c.type == "Healthy" and c.status == "True" then healthy = true end
          if c.type == "Installed" and c.status == "True" then installed = true end
        end
        if healthy and installed then hs.status = "Healthy"; hs.message = "Installed and healthy" end
      end
      return hs
    resource.customizations.health.apiextensions.crossplane.io_CompositeResourceDefinition: |
      hs = { status = "Progressing", message = "Waiting for XRD to be established" }
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, c in ipairs(obj.status.conditions) do
          if c.type == "Established" and c.status == "True" then hs.status = "Healthy"; hs.message = "Established" end
        end
      end
      return hs
    resource.customizations.health.platform.keystone.io_PostgresDatabase: |
      hs = { status = "Progressing", message = "Provisioning database" }
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, c in ipairs(obj.status.conditions) do
          if c.type == "Synced" and c.status == "False" then hs.status = "Degraded"; hs.message = c.message or "Sync failed" end
          if c.type == "Ready" and c.status == "True" then hs.status = "Healthy"; hs.message = "Ready" end
        end
      end
      return hs
    resource.customizations.ignoreDifferences.platform.keystone.io_PostgresDatabase: |
      jsonPointers:
        - /spec/crossplane
