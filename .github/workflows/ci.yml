name: keystone-ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch: # lets the FinOps advisor run these guardrails on the PRs it opens

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint manifests, scripts and app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: Validate Kubernetes manifests (incl. CRDs)
        run: |
          helm lint gitops/bootstrap
          helm template keystone gitops/bootstrap > /tmp/apps.yaml
          kubeconform -strict -summary -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/apps.yaml gitops/platform gitops/tenants kind/cluster.yaml
      - name: ShellCheck
        run: shellcheck scripts/*.sh
      - name: Policy tests (Gatekeeper gator)
        run: |
          curl -sSL https://github.com/open-policy-agent/gatekeeper/releases/download/v3.23.1/gator-v3.23.1-linux-amd64.tar.gz | tar -xz gator
          ./gator verify policies/tests/... -v
      - name: Render the self-service composition (crossplane render)
        run: |
          curl -sSfL "https://cli.crossplane.io/stable/v2.5.0/bin/linux_amd64/crossplane" -o crossplane && chmod +x crossplane
          for xr in examples/render/*.yaml; do
            echo "== $xr"
            ./crossplane render "$xr" gitops/platform/self-service/composition.yaml gitops/platform/self-service/functions.yaml \
              --include-full-xr > "/tmp/render-$(basename "$xr")"
            cat "/tmp/render-$(basename "$xr")"
          done
          grep -qE 'estimatedMonthlyCostUSD: .?\$21\.45' /tmp/render-prod-small.yaml
          grep -q 'failoverQuorum: true' /tmp/render-prod-small.yaml
          if grep -q 'kind: Pooler' /tmp/render-dev-hibernated.yaml; then echo "hibernated DB must not get a pooler"; exit 1; fi
          kubeconform -strict -summary -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -skip PostgresDatabase /tmp/render-*.yaml
      - name: App and FinOps advisor unit tests
        run: |
          pip install pytest pyyaml
          (cd apps/orders && pytest -q)
          (cd tools/finops-advisor && pytest -q)
      - name: Migration safety lint (Squawk)
        run: |
          curl -sSfL -o squawk https://github.com/sbdchd/squawk/releases/download/v2.73.0/squawk-linux-x64 && chmod +x squawk
          echo "== shipped migrations must be lock-safe"
          ./squawk gitops/tenants/orders/migrations/*.up.sql migrations-tests/live/*.sql
          echo "== known-dangerous migrations must be rejected, for the right reason"
          declare -A expect=(
            [index-without-concurrently]=require-concurrent-index-creation
            [change-column-type]=changing-column-type
            [add-required-column]=adding-required-field
            [no-lock-timeout]=require-lock-timeout
          )
          for name in "${!expect[@]}"; do
            if out=$(./squawk "migrations-tests/unsafe/$name.sql" 2>&1); then
              echo "::error::$name.sql was not rejected"; exit 1
            fi
            grep -q "${expect[$name]}" <<<"$out" || { echo "::error::$name.sql not flagged as ${expect[$name]}"; echo "$out"; exit 1; }
            echo "rejected $name.sql: ${expect[$name]}"
          done
          echo "== every migration file is shipped in the ConfigMap"
          for f in gitops/tenants/orders/migrations/*.sql; do
            grep -q "$f" <(sed 's#^ *- #gitops/tenants/orders/#' gitops/tenants/orders/kustomization.yaml) \
              || { echo "::error::$f is missing from kustomization.yaml"; exit 1; }
          done
          kubectl kustomize gitops/tenants/orders > /dev/null
      - name: SLO rules are up to date (sloth generate)
        run: |
          curl -sSfL -o sloth https://github.com/slok/sloth/releases/download/v0.16.0/sloth-linux-amd64 && chmod +x sloth
          ./sloth generate -i slos/orders.yaml -o /tmp/slo-orders.yaml
          diff -u gitops/platform/observability-config/slo-orders.yaml /tmp/slo-orders.yaml \
            || { echo "::error::Run 'make slo' and commit the regenerated rules"; exit 1; }

  terraform:
    name: Terraform (fmt, validate, tflint, checkov)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/aws
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
      - uses: terraform-linters/setup-tflint@v6
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: tflint --init && tflint --format compact
      - name: Checkov
        run: |
          pip install --quiet checkov
          checkov -d . --framework terraform --config-file .checkov.yaml --quiet --compact

  e2e:
    name: Platform on Kubernetes (kind)
    needs: [static]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
        with:
          cluster_name: keystone
          config: kind/cluster.yaml
      - name: Build the sample app and load it into kind
        run: |
          docker build -t keystone/orders:dev apps/orders
          kind load docker-image keystone/orders:dev --name keystone
      - name: Bootstrap Argo CD and hand over to GitOps (this commit)
        run: scripts/bootstrap.sh "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Wait for every app to be Synced and Healthy
        run: scripts/wait-for-apps.sh 1500
      - name: Verify HA, replication, backups and the app
        run: scripts/verify-platform.sh
      - name: Verify self-service databases and guardrails
        run: scripts/verify-self-service.sh
      - name: Verify observability and SLOs
        run: scripts/verify-observability.sh
      - name: FinOps advisor finds the idle and the over-provisioned database
        run: |
          pip install --quiet pyyaml
          scripts/finops-advisor.sh check
      - name: Chaos under load - kill the primary, isolate the primary (measured RTO / RPO)
        run: scripts/chaos-experiments.sh
      - name: Point-in-time restore drill from the S3 backups
        run: scripts/restore-drill.sh
      - name: Zero-downtime migration, automatic rollback of a bad release, promotion of a good one
        run: scripts/verify-safe-change.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chaos-results
          path: chaos-results/
          if-no-files-found: ignore
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get applications -n argocd -o wide || true
          kubectl get pods -A -o wide || true
          kubectl get postgresdatabases -A -o wide || true
          kubectl -n orders describe postgresdatabase orders-db | tail -40 || true
          kubectl get functions,xrd,compositions || true
          kubectl -n orders get cluster,backups,poolers,objectstores -o wide || true
          kubectl -n orders describe cluster orders-db | tail -60 || true
          kubectl -n cnpg-system logs deploy/plugin-barman-cloud --tail=80 || true
          kubectl -n monitoring get pods,prometheusrules,podmonitors -A 2>/dev/null | head -60 || true
          kubectl -n orders get rollout,analysisruns,jobs -o wide || true
          kubectl -n orders logs job/write-probe --tail=20 2>/dev/null || true
          kubectl -n orders logs job/orders-migrate --tail=30 || true
          kubectl -n backup-store logs deploy/object-store --tail=50 || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true
