# Crossplane may only compose the resource kinds a database needs (least privilege).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: keystone:aggregate-to-crossplane
  labels:
    rbac.crossplane.io/aggregate-to-crossplane: "true"
rules:
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters, scheduledbackups, poolers]
    verbs: ["*"]
  - apiGroups: [barmancloud.cnpg.io]
    resources: [objectstores]
    verbs: ["*"]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: ["*"]
