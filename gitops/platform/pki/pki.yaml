# Platform PKI: a self-signed root -> an internal CA ClusterIssuer that signs in-cluster TLS certificates.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-root
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keystone-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: keystone-root-ca
  secretName: keystone-root-ca
  duration: 8760h # 1 year
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { name: selfsigned-root, kind: ClusterIssuer, group: cert-manager.io }
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: keystone-ca
spec:
  ca:
    secretName: keystone-root-ca
