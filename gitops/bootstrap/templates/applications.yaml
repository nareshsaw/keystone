{{- $repo := .Values.repoURL -}}
{{- $rev := .Values.revision -}}
{{- define "keystone.syncPolicy" }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
{{- end }}
# ---------------------------------------------------------------- wave 0: certificates
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "0" }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  destination: { server: https://kubernetes.default.svc, namespace: cert-manager }
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.3
    helm:
      valuesObject:
        crds: { enabled: true }
{{- include "keystone.syncPolicy" . }}
---
# ---------------------------------------------------------------- wave 1: Postgres operator + PKI
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "1" }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  destination: { server: https://kubernetes.default.svc, namespace: cnpg-system }
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.1
{{- include "keystone.syncPolicy" . }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-pki
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "1" }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  destination: { server: https://kubernetes.default.svc, namespace: cert-manager }
  source: { repoURL: {{ $repo }}, targetRevision: {{ $rev }}, path: gitops/platform/pki }
{{- include "keystone.syncPolicy" . }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatekeeper
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "1" }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  destination: { server: https://kubernetes.default.svc, namespace: gatekeeper-system }
  source:
    repoURL: https://open-policy-agent.github.io/gatekeeper/charts
    chart: gatekeeper
    targetRevision: 3.23.1
    helm:
      valuesObject:
        replicas: 1
        auditInterval: 60
{{- include "keystone.syncPolicy" . }}
---
apiVersion: argoproj.io/v1alpha1
