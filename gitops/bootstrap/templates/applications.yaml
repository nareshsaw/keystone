# ---------------------------------------------------------------- wave 4: tenants (one app per folder)
{{- range .Values.tenants }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-{{ . }}
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "4" }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  destination: { server: https://kubernetes.default.svc, namespace: {{ . }} }
  source: { repoURL: {{ $repo }}, targetRevision: {{ $rev }}, path: gitops/tenants/{{ . }} }
{{- include "keystone.syncPolicy" $ }}
{{- end }}
