apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orders
resources:
  - namespace.yaml
  - database.yaml
  - migrate-job.yaml
  - app.yaml
  - monitoring.yaml
configMapGenerator:
  - name: orders-migrations
    options:
      disableNameSuffixHash: true
    files:
      - migrations/000001_create_orders.up.sql
      - migrations/000001_create_orders.down.sql
      - migrations/000002_add_customer_email.up.sql
      - migrations/000002_add_customer_email.down.sql
      - migrations/000003_index_created_at.up.sql
      - migrations/000003_index_created_at.down.sql
