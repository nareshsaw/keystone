# This is all a team writes to get a production database.
apiVersion: platform.keystone.io/v1alpha1
kind: PostgresDatabase
metadata:
  name: orders-db
spec:
  environment: prod      # 3 instances, zero-data-loss replication, backups enforced
  tier: small
  databaseName: orders
  owner: team-orders
  costCenter: CC-1001
